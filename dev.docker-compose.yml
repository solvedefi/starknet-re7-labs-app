services:
  postgres:
    image: postgres:16-alpine
    container_name: starknet-re7-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pwd
      - POSTGRES_DB=starknet-re7
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'user', '-d', 'starknet-re7']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
